name: Generate 11 Nepali Comedy Character Images
on:
  workflow_dispatch:
    inputs:
      character:
        description: Generate all 11 or one character ID
        required: true
        type: string
        default: all
      image_size:
        description: Image resolution (higher resolution costs more)
        required: true
        type: choice
        options: [1K, 2K, 4K]
        default: 2K
      force:
        description: Regenerate existing images
        required: true
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Gen AI SDK
        run: pip install --upgrade google-genai
      - name: Generate character reference portraits
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-nano-banana-2.1' }}
        run: |
          ARGS=(--character "${{ inputs.character }}" --image-size "${{ inputs.image_size }}")
          if [ "${{ inputs.force }}" = "true" ]; then ARGS+=(--force); fi
          python studio/generate_character_images.py "${ARGS[@]}"
      - name: Save generated portraits permanently in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/characters/generated/
          git diff --cached --quiet || git commit -m "Add Nano Banana character reference portraits"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: nepali-comedy-11-character-images-${{ github.run_id }}
          path: studio/characters/generated/
          if-no-files-found: error
          retention-days: 90
